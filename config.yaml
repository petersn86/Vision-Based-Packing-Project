# Vision-Based Packing Project Configuration
# ============================================

# Video Processing Settings
video:
  frame_interval: 1.0
  default_video: "data/videos/packing_video.mp4"

# Directory Paths
paths:
  frames_dir: "data/frames"
  annotated_dir: "data/yolo_frames"
  videos_dir: "data/videos"
  refined_items_file: "refined_item_list.txt"
  detection_log_file: "detection_log.csv"
  annotated_video_file: "data/videos/output_annotated.mp4"

# YOLO Detection Settings
detection:
  yolo_model: "models/yolo11l.pt"
  box_model: "models/cardboard_YOLO25.pt"
  box_labels:
    - "box"
    - "carton"
    - "cardboard"
  confidence_threshold: 0.55        # Raised from 0.40 (was causing too much noise)
                                     # Lower than original 0.60 to catch screwdriver
  box_confidence_threshold: 0.35
  ignore_labels:
    - "person"
    - "people"
    - "refrigerator"  # Always false positive in packing boxes
    - "microwave"     # Also too large for boxes
    - "oven"

# Plausibility Filter
plausibility_filter:
  enabled: true
  thresholds:
    # Furniture (too large to fit in packing boxes)
    # Very high thresholds since from above these would fill entire frame
    bed: 0.95           # Bed from above = entire frame
    couch: 0.80         # Couch from above = most of frame
    sofa: 0.80          # Same as couch
    bench: 0.70         # Bench still large
    chair: 0.50         # Chair could be smaller but still sizable
    desk: 0.75          # Desk from above = large surface
    dining table: 0.80  # Table from above = large surface
    # Already in plausibility_filter.py defaults:
    # refrigerator: 0.60, microwave: 0.40, oven: 0.50, etc.

# LLaMA Vision Settings
llama:
  model_name: "llama3.2-vision"
  enabled: true
  max_retries: 3
  retry_delay: 1.0

# Object Tracking Settings (ByteTrack + MobileNetV2 re-ID)
tracking:
  enabled: true
  track_thresh: 0.5
  track_buffer: 60
  match_thresh: 0.7
  second_match_thresh: 0.4
  reid_enabled: true
  reid_thresh: 0.50
  reid_buffer: 150

# Box Tracker
box_tracker:
  iou_threshold: 0.3
  max_age: 30

# Item Registry
item_registry:
  same_item_window: 20
  label_similarity_threshold: 0.5   # Raised from 0.3 for better merging

# QR Code Detection
qr_detection:
  enabled: false
  proximity_threshold: 100

# Entry Detection
entry_detection:
  enabled: true
  entry_threshold: 1
  exit_threshold: 1
  overlap_threshold: 0.20
  require_motion: false

exit_detection:
  enabled: true

  # Stage 1 — hand overlap
  hand_overlap_threshold: 0.50      # fraction of item bbox covered by a hand bbox

  # Stage 2 — absence gates before LLaMA fires
  absence_threshold: 5              # frames for HAND-FLAGGED items (fast path)
                                     # At 2fps -> ~2.5 seconds after hand interaction
  geometric_threshold: 25           # frames for NON-hand-flagged items (slow path)
                                     # At 2fps -> ~12.5 seconds of continuous absence
                                     # High intentionally -- YOLO drops stationary items often

  # LLaMA verification
  llama_verification: true

  # Stale track eviction -- frames without YOLO detection before a track is
  # evicted from confirmed_entries so absence counting can begin.
  # Keep this HIGH to avoid reacting to normal YOLO dropout on still objects.
  stale_threshold: 6               # At 2fps -> ~6 seconds of no YOLO detection            # At 2fps -> ~6 seconds of no YOLO detection

# Output Settings
output:
  create_video: true
  video_codec: "mp4v"
  video_fps: 10
  save_cropped_images: true
  save_annotated_frames: true
  export_format: "both"

# Logging
logging:
  level: "INFO"
  log_file: "app.log"
  console_output: true

# Performance
performance:
  use_gpu: true
  batch_size: 1
  num_workers: 4
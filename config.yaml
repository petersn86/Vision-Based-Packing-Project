# Vision-Based Packing Project Configuration
# ============================================

# Video Processing Settings
video:
  frame_interval: 0.5
  default_video: "data/videos/packing_video.mp4"

# Directory Paths
paths:
  frames_dir: "data/frames"
  annotated_dir: "data/yolo_frames"
  videos_dir: "data/videos"
  refined_items_file: "refined_item_list.txt"
  detection_log_file: "detection_log.csv"
  annotated_video_file: "data/videos/output_annotated.mp4"

# YOLO Detection Settings
detection:
  yolo_model: "models/yolo11l.pt"
  box_model: "models/cardboard_YOLO25.pt"
  box_labels:
    - "box"
    - "carton"
    - "cardboard"
  confidence_threshold: 0.60
  box_confidence_threshold: 0.35
  ignore_labels:
    - "person"
    - "people"

# Plausibility Filter
# Discards detections whose label implies a large object but whose bbox
# is too small relative to the frame to plausibly be that object.
plausibility_filter:
  enabled: true
  thresholds: {}
  # Examples:
  #   microwave: 0.30
  #   refrigerator: 0.70

# LLaMA Vision Settings
llama:
  model_name: "llama3.2-vision"
  enabled: true
  max_retries: 3
  retry_delay: 1.0

# Object Tracking Settings (ByteTrack + MobileNetV2 re-ID)
tracking:
  enabled: true
  track_thresh: 0.5
  track_buffer: 60
  match_thresh: 0.7
  second_match_thresh: 0.4
  reid_enabled: true
  # reid_thresh: cosine similarity threshold for re-identifying a lost object.
  # 0.50 works well with MobileNetV2 embeddings for held/moving items.
  # Raise toward 0.70 if different objects are being incorrectly merged.
  # Lower toward 0.35 if the same object keeps getting new IDs.
  reid_thresh: 0.50
  reid_buffer: 150

# Box Tracker
# Assigns stable IDs to detected boxes across frames so that
# ItemRegistry can correctly deduplicate items by (label + box_id).
# Without this, box_id changes every frame and every detection looks
# like a new item to the registry.
box_tracker:
  # Minimum IOU between two box detections to consider them the same
  # physical box. 0.3 is permissive enough to handle slight camera shake.
  iou_threshold: 0.3
  # Frames a box can go undetected before its ID is retired.
  # At 0.5s interval: 30 frames = 15 seconds.
  max_age: 30

# Item Registry
# Deduplicates items by (label + box_id + recency) rather than track ID.
# This means a Dial bottle that gets 6 different track IDs still only
# appears once in the final item list.
item_registry:
  # Number of frames within which a re-detection of the same label+box
  # is considered the same physical item rather than a new one.
  # At 0.5s frame interval:  60 frames = 30 seconds
  # At 1.0s frame interval:  60 frames = 60 seconds
  # Increase if items are out of frame for long stretches.
  # Decrease if genuinely different items of the same type are packed
  # in rapid succession and being incorrectly merged.
  # At 0.5s frame interval: 10 frames = 5 seconds.
  # Keeps legitimate re-detections of the same object merged while
  # ensuring a different object with the same YOLO label (e.g. screwdriver
  # also labeled "bottle") gets its own instance after a few seconds gap.
  same_item_window: 10

# QR Code Detection
qr_detection:
  enabled: false
  proximity_threshold: 100

# Entry Detection
entry_detection:
  enabled: true
  entry_threshold: 1
  exit_threshold: 1
  overlap_threshold: 0.20
  require_motion: false

# Output Settings
output:
  create_video: true
  video_codec: "mp4v"
  video_fps: 10
  save_cropped_images: true
  save_annotated_frames: true
  export_format: "both"

# Logging
logging:
  level: "INFO"
  log_file: "app.log"
  console_output: true

# Performance
performance:
  use_gpu: true
  batch_size: 1
  num_workers: 4